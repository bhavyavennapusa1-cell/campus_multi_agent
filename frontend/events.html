<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Synapse | Events</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
 <link rel="stylesheet" href="dashboard.css">
 <style>
 .events-container {
 max-width: 1100px;
 margin: 0 auto;
 padding: 2rem 5%;
 }

 .category-pills-bar {
 display: flex;
 flex-wrap: wrap;
 gap: 0.6rem;
 margin-bottom: 2rem;
 justify-content: center;
 }

 .category-pill {
 font-family: var(--font-heading);
 background: var(--surface);
 color: var(--text-main);
 border: 2px solid var(--border-dark);
 border-radius: 50px;
 padding: 0.5rem 1.25rem;
 font-size: 0.9rem;
 cursor: pointer;
 box-shadow: 2px 2px 0px var(--border-dark);
 transition: all 0.15s ease;
 }

 .category-pill:hover {
 transform: translateY(-2px);
 background: var(--soft-yellow);
 }

 .category-pill.active {
 background: var(--primary-blue);
 color: white;
 box-shadow: 3px 3px 0px var(--border-dark);
 }

 .cards-grid {
 display: grid;
 grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
 gap: 1.5rem;
 }

 .event-card {
 background: var(--surface);
 border: 3px solid var(--border-dark);
 border-radius: 20px;
 padding: 1.5rem;
 box-shadow: 4px 4px 0px var(--border-dark);
 display: flex;
 flex-direction: column;
 justify-content: space-between;
 transition: transform 0.2s;
 }

 .event-card:hover {
 transform: translateY(-3px);
 }
 </style>
</head>
<body>
 <!-- Background Widgets Container (Fixed to viewport, scattered to prevent overlap) -->
 <div class="fixed-background-widgets">
 <!-- Left Side Spread -->
 <svg class="widget-sticker" style="top: 8%; left: 4%; width: 45px; animation-delay: 0s; transform: rotate(-12deg);" viewBox="0 0 100 80" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
 <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C90 30, 80 30, 50 30 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 35%; left: 8%; width: 50px; animation-delay: 0.5s; transform: rotate(15deg);" viewBox="0 0 100 100" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 65%; left: 3%; width: 40px; animation-delay: 1.2s; transform: rotate(-8deg);" viewBox="0 0 100 100" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
 <rect x="15" y="60" width="70" height="20" rx="3" fill="#A8E6CF"/>

 <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
 </svg>

 <!-- Center-ish Spread (Safely peeking behind gaps in cards) -->
 <svg class="widget-sticker" style="top: 20%; left: 30%; width: 35px; animation-delay: 0.8s; transform: rotate(10deg);" viewBox="0 0 100 100" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 75%; left: 45%; width: 30px; animation-delay: 1.5s; transform: rotate(-15deg);" viewBox="0 0 100 80" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
 <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
 </svg>
 <svg class="widget-sticker" style="bottom: 8%; left: 35%; width: 40px; animation-delay: 2.2s; transform: rotate(-5deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
 <rect x="15" y="60" width="70" height="20" rx="3" fill="#D1C4E9"/>
 </svg>

 <!-- Right Side Spread -->
 <svg class="widget-sticker" style="top: 12%; right: 6%; width: 40px; animation-delay: 0.3s; transform: rotate(25deg);" viewBox="0 0 100 100" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 38%; right: 4%; width: 45px; animation-delay: 1.8s; transform: rotate(-18deg);" viewBox="0 0 100 80" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
 <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C90 30, 80 30, 50 30 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 60%; right: 9%; width: 50px; animation-delay: 0.7s; transform: rotate(8deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 82%; right: 5%; width: 35px; animation-delay: 1.4s; transform: rotate(-22deg);" viewBox="0 0 100 100" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
 <rect x="10" y="10" width="80" height="80" rx="4"/>
 <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
 </svg>
 <svg class="widget-sticker" style="top: 25%; right: 25%; width: 30px; animation-delay: 1s; transform: rotate(12deg);" viewBox="0 0 100 100" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
 <rect x="10" y="10" width="80" height="80" rx="4"/>
 <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
 </svg>
 </div>

 <!-- Navbar Reused -->
 <nav class="navbar">
 <div class="nav-brand"> Synapse</div>
 <button class="hamburger" id="hamburger"></button>
 <div class="nav-links" id="nav-links">
 <a href="index.html">Home</a>
 <a href="dashboard.html">Dashboard</a>
 <a href="chat.html">Assistant</a>
 <button id="theme-toggle" class="btn-pill" style="display: inline-flex; align-items: center; justify-content: center; padding: 0.5rem; border-radius: 50%; cursor: pointer; transition: all 0.2s ease;" title="Toggle Theme">
    <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>
 <a href="#" onclick="handleLogout(event)" style="background: #c0392b; color: white; border-radius: 20px; padding: 0.35rem 0.85rem; font-weight: 700; text-decoration: none;">Log out </a>
 </div>
 </nav>

 <main class="events-container" style="position: relative; z-index: 10;">

 <!-- Hero Header -->
 <div class="cloud-container" style="padding: 2rem; margin-bottom: 2rem;">
 <a href="chat.html?prompt=What%20upcoming%20events%20and%20hackathons%20can%20I%20join%3F" class="sticker-tag route-to-chat" data-prompt="What upcoming events and hackathons can I join?" style="background: var(--bubble-pink); text-decoration: none; cursor: pointer; display: inline-block;"> Campus Life & Workshops</a>
 <h1 style="font-family: var(--font-heading); font-size: 2.5rem; color: var(--primary-blue);">Events & Hackathons</h1>
 <p style="color: var(--text-muted); max-width: 600px; margin: 0.5rem auto 0;">
 Discover upcoming technical workshops, hackathons, club meetups, and coding competitions.
 </p>
 </div>

 <!-- Filter Pills by Type -->
 <div class="category-pills-bar">
 <button class="category-pill active" onclick="filterEvents('All', this)">All Events</button>
 <button class="category-pill" onclick="filterEvents('hackathon', this)">Hackathons</button>
 <button class="category-pill" onclick="filterEvents('workshop', this)">Workshops</button>
 <button class="category-pill" onclick="filterEvents('competition', this)">Competitions</button>
 <button class="category-pill" onclick="filterEvents('club', this)">Club Meets</button>
 </div>

 <!-- Events Cards Grid -->
 <div class="cards-grid" id="events-grid">
 <!-- Dynamic Event Cards rendered here -->
 </div>
 </main>

 <footer class="footer">
 <p>Built with ️ for AgentX National Hackathon 2026 | <a href="https://github.com/bhavyavennapusa1-cell/campus_multi_agent" target="_blank" style="color: var(--primary-blue); font-weight: 600;">GitHub Repository</a></p>
 </footer>

 <script>
 document.getElementById('hamburger').addEventListener('click', () => {
 document.getElementById('nav-links').classList.toggle('active');
 });

 // Track local mock registration states
 const registeredEventIds = new Set();

 // TODO: replace with real GET /events
 const MOCK_EVENTS = [
 {
 id: "ev-1",
 name: "AgentX National AI Hackathon 2026",
 date: "Aug 08, 2026",
 time: "10:00 AM - 06:00 PM",
 venue: "Main Campus Auditorium",
 organizer: "AI Student Society & Google AGY Team",
 seatsAvailable: 45,
 type: "hackathon"
 },
 {
 id: "ev-2",
 name: "Distributed Microservices & Kubernetes Workshop",
 date: "Aug 12, 2026",
 time: "02:00 PM - 05:00 PM",
 venue: "Tech Tower Lab 2",
 organizer: "Cloud Infrastructure Club",
 seatsAvailable: 15,
 type: "workshop"
 },
 {
 id: "ev-3",
 name: "Algorithmic Code Sprint 2026",
 date: "Aug 16, 2026",
 time: "06:00 PM - 09:00 PM",
 venue: "Online Judge / Computer Center",
 organizer: "Competitive Coding Guild",
 seatsAvailable: 120,
 type: "competition"
 },
 {
 id: "ev-4",
 name: "Open Source Developers & Rust Meetup",
 date: "Aug 20, 2026",
 time: "04:00 PM - 06:00 PM",
 venue: "Student Hub Room 101",
 organizer: "FOSS Campus Chapter",
 seatsAvailable: 28,
 type: "club"
 }
 ];

 let currentFilter = 'All';

 function renderEvents() {
 const grid = document.getElementById('events-grid');
 const list = MOCK_EVENTS.filter(e => currentFilter === 'All' || e.type.toLowerCase() === currentFilter.toLowerCase());

 if (list.length === 0) {
 grid.innerHTML = `<div style="text-align: center; padding: 2rem; color: var(--text-muted);">No events found in this category.</div>`;
 return;
 }

 let html = '';
 list.forEach(item => {
 const isRegistered = registeredEventIds.has(item.id);

 let badgeBg = 'var(--soft-yellow)';
 if (item.type === 'hackathon') badgeBg = 'var(--bubble-pink)';
 if (item.type === 'workshop') badgeBg = 'var(--mint-green)';
 if (item.type === 'competition') badgeBg = 'var(--lavender)';

 html += `
 <div class="event-card">
 <div>
 <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
 <span class="sticker-tag" style="background: ${badgeBg}; font-size: 0.75rem; margin: 0;">${item.type.toUpperCase()}</span>
 <span class="sticker-tag" style="background: var(--surface); font-size: 0.75rem; margin: 0;">${item.seatsAvailable} Seats Left</span>
 </div>
 <h3 style="font-family: var(--font-heading); color: var(--primary-blue); font-size: 1.25rem;">${item.name}</h3>
 <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">
 <div> <strong>Date:</strong> ${item.date} (${item.time})</div>
 <div style="margin-top: 0.2rem;"> <strong>Venue:</strong> ${item.venue}</div>
 <div style="margin-top: 0.2rem;"> <strong>Host:</strong> ${item.organizer}</div>
 </div>
 </div>

 <div style="display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap;">
 <button class="btn-pill" style="${isRegistered ? 'background: #c0392b; color: white;' : 'background: var(--primary-blue); color: white;'}" onclick="toggleEventRegistration('${item.id}', '${item.name}')">
 ${isRegistered ? 'Cancel Registration' : 'Register'}
 </button>
 <!-- Naming rule: "Add to Calendar", not API name -->
 <button class="btn-pill" style="background: var(--surface); color: var(--text-main);" onclick="addToCalendar('${item.name}', '${item.date}')">
 Add to Calendar 
 </button>
 </div>
 </div>
 `;
 });
 grid.innerHTML = html;
 }

 function filterEvents(category, el) {
 currentFilter = category;
 document.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
 el.classList.add('active');
 renderEvents();
 }

 // Connects to real POST /events/register
 async function toggleEventRegistration(eventId, eventName) {
 if (registeredEventIds.has(eventId)) {
 registeredEventIds.delete(eventId);
 alert(`Cancelled registration for "${eventName}".`);
 } else {
 registeredEventIds.add(eventId);
 try {
 if (window.CampusApi && window.CampusApi.registerEvent) {
 await window.CampusApi.registerEvent(eventName);
 }
 } catch (e) {
 console.warn("Event registration backend fallback:", e);
 }
 alert(` Successfully registered for "${eventName}"!`);
 }
 renderEvents();
 }

 // "Add to Calendar" -> Export real .ics calendar file
 function addToCalendar(eventName, eventDate) {
 console.log('[Calendar .ics Export] Generating iCalendar file for:', eventName);
 try {
 if (typeof downloadIcsFile === 'function') {
 downloadIcsFile(eventName, eventDate, 'Campus Auditorium', `Official Campus Event: ${eventName}`);
 } else {
 const icsContent = [
 'BEGIN:VCALENDAR',
 'VERSION:2.0',
 'PRODID:-//Synapse Multi-Agent//NONSGML v1.0//EN',
 'CALSCALE:GREGORIAN',
 'METHOD:PUBLISH',
 'BEGIN:VEVENT',
 `SUMMARY:${eventName}`,
 `DESCRIPTION:Official Campus Event: ${eventName}`,
 `LOCATION:Campus Auditorium`,
 `DTSTART:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
 `DTEND:${new Date(Date.now() + 3600000).toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
 'STATUS:CONFIRMED',
 'END:VEVENT',
 'END:VCALENDAR'
 ].join('\r\n');

 const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.style.display = 'none';
 a.href = url;
 a.download = `${eventName.replace(/[^a-zA-Z0-9]/g, '_')}_reminder.ics`;
 document.body.appendChild(a);
 a.click();
 document.body.removeChild(a);
 setTimeout(() => URL.revokeObjectURL(url), 1000);
 }
 } catch (err) {
 console.error('[Calendar Error]:', err);
 }

 if (window.CampusApi && window.CampusApi.scheduleCalendar) {
 window.CampusApi.scheduleCalendar(eventName, eventDate).catch(e => console.warn("Calendar API async warning:", e));
 }
 }


 renderEvents();
  </script>
  <script src="script.js"></script>
</body>
</html>
