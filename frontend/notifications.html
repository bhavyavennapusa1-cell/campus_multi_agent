<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse | Notifications</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .notifications-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 2rem 5%;
        }

        .notification-card {
            background: var(--surface);
            border: 2px solid var(--border-dark);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 3px 3px 0px var(--border-dark);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--border-dark);
        }

        .notification-card.unread {
            border-left: 6px solid var(--primary-blue);
            background: #f8fbff;
        }

        .notification-icon-bg {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            box-shadow: 2px 2px 0px var(--border-dark);
        }
    </style>
</head>
<body>
    <!-- Background Widgets Container (Fixed to viewport, scattered to prevent overlap) -->
    <div class="fixed-background-widgets">
        <!-- Left Side Spread -->
        <svg class="widget-sticker" style="top: 8%; left: 4%; width: 45px; animation-delay: 0s; transform: rotate(-12deg);" viewBox="0 0 100 80" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
            <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C90 30, 80 30, 50 30 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
        </svg>
        <svg class="widget-sticker" style="top: 35%; left: 8%; width: 50px; animation-delay: 0.5s; transform: rotate(15deg);" viewBox="0 0 100 100" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
            <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
        </svg>
        <svg class="widget-sticker" style="top: 65%; left: 3%; width: 40px; animation-delay: 1.2s; transform: rotate(-8deg);" viewBox="0 0 100 100" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
            <rect x="15" y="60" width="70" height="20" rx="3" fill="#A8E6CF"/>
            <rect x="20" y="40" width="60" height="20" rx="3" fill="#FFB6C1"/>
        </svg>
        <svg class="widget-sticker" style="top: 85%; left: 12%; width: 45px; animation-delay: 2s; transform: rotate(20deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
            <rect x="10" y="10" width="80" height="80" rx="4"/>
            <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
        </svg>

        <!-- Center-ish Spread (Safely peeking behind gaps in cards) -->
        <svg class="widget-sticker" style="top: 20%; left: 30%; width: 35px; animation-delay: 0.8s; transform: rotate(10deg);" viewBox="0 0 100 100" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
            <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
        </svg>
        <svg class="widget-sticker" style="top: 75%; left: 45%; width: 30px; animation-delay: 1.5s; transform: rotate(-15deg);" viewBox="0 0 100 80" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
            <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
        </svg>
        <svg class="widget-sticker" style="bottom: 8%; left: 35%; width: 40px; animation-delay: 2.2s; transform: rotate(-5deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
            <rect x="15" y="60" width="70" height="20" rx="3" fill="#D1C4E9"/>
        </svg>

        <!-- Right Side Spread -->
        <svg class="widget-sticker" style="top: 12%; right: 6%; width: 40px; animation-delay: 0.3s; transform: rotate(25deg);" viewBox="0 0 100 100" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
            <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
        </svg>
        <svg class="widget-sticker" style="top: 38%; right: 4%; width: 45px; animation-delay: 1.8s; transform: rotate(-18deg);" viewBox="0 0 100 80" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
            <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C90 30, 80 30, 50 30 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
        </svg>
        <svg class="widget-sticker" style="top: 60%; right: 9%; width: 50px; animation-delay: 0.7s; transform: rotate(8deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
            <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
        </svg>
        <svg class="widget-sticker" style="top: 82%; right: 5%; width: 35px; animation-delay: 1.4s; transform: rotate(-22deg);" viewBox="0 0 100 100" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
            <rect x="10" y="10" width="80" height="80" rx="4"/>
            <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
        </svg>
        <svg class="widget-sticker" style="top: 25%; right: 25%; width: 30px; animation-delay: 1s; transform: rotate(12deg);" viewBox="0 0 100 100" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
            <rect x="10" y="10" width="80" height="80" rx="4"/>
            <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
        </svg>
    </div>

    <!-- Navbar Reused -->
    <nav class="navbar">
        <div class="nav-brand">🔗 Synapse</div>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Assistant</a>
            <a href="#" onclick="handleLogout(event)" style="background: #c0392b; color: white; border-radius: 20px; padding: 0.35rem 0.85rem; font-weight: 700; text-decoration: none;">Log out 🚪</a>
        </div>
    </nav>

    <main class="notifications-container" style="position: relative; z-index: 10;">

        <!-- Hero Header -->
        <div class="cloud-container" style="padding: 1.75rem; margin-bottom: 2rem;">
            <a href="chat.html?prompt=Show%20my%20recent%20notifications%20and%20campus%20alerts" class="sticker-tag route-to-chat" data-prompt="Show my recent notifications and campus alerts" style="background: var(--bubble-pink); text-decoration: none; cursor: pointer; display: inline-block;">🔔 Activity Feed</a>
            <h1 style="font-family: var(--font-heading); font-size: 2.3rem; color: var(--primary-blue);">Notifications</h1>
            <p style="color: var(--text-muted); max-width: 600px; margin: 0.25rem auto 0;">
                Real-time alerts generated across all academic, placement, event, and service agents.
            </p>
        </div>

        <!-- Filter & Actions Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <div style="font-family: var(--font-heading); font-size: 1.1rem; color: var(--text-main);">
                Recent Alerts (<span style="color: var(--primary-blue);">3 Unread</span>)
            </div>
            <button class="btn-pill" style="font-size: 0.8rem; padding: 0.3rem 0.8rem;" onclick="markAllAsRead()">Mark all as read ✓</button>
        </div>

        <!-- Scrollable Notifications List (Cap to max 20) -->
        <div id="notifications-list">
            <!-- Dynamic notifications rendered here -->
        </div>

        <!-- View All Link Stub -->
        <div style="text-align: center; margin-top: 2rem;">
            <button id="archive-btn" class="btn-pill" style="background: var(--surface); color: var(--text-main);" onclick="viewHistoricalArchive()">
                View all notifications (Historical Archive) →
            </button>
        </div>
    </main>

    <footer class="footer">
        <p>Built with ❤️ for AgentX National Hackathon 2026 | <a href="https://github.com/bhavyavennapusa1-cell/campus_multi_agent" target="_blank" style="color: var(--primary-blue); font-weight: 600;">GitHub Repository</a></p>
    </footer>

    <script>
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('active');
        });

        // TODO: Replace with real GET /student/notifications
        const MOCK_NOTIFICATIONS = [
            {
                id: 1,
                category: "exam reminder",
                icon: "📝",
                badgeBg: "var(--mint-green)",
                title: "Distributed Systems Midterm Exam",
                message: "Exam scheduled in 4 days at Tech Tower Hall 3.",
                timestamp: "10 mins ago",
                unread: true
            },
            {
                id: 2,
                category: "placement deadline",
                icon: "💼",
                badgeBg: "var(--soft-yellow)",
                title: "Google Backend Internship Drive",
                message: "Eligibility verified! Application deadline is Aug 15.",
                timestamp: "45 mins ago",
                unread: true
            },
            {
                id: 3,
                category: "event reminder",
                icon: "⚡",
                badgeBg: "var(--bubble-pink)",
                title: "AgentX National Hackathon Keynote",
                message: "Starts tomorrow at 10:00 AM in Main Auditorium.",
                timestamp: "2 hours ago",
                unread: true
            },
            {
                id: 4,
                category: "assignment deadline",
                icon: "📚",
                badgeBg: "var(--lavender)",
                title: "Database SQL Optimization Assignment",
                message: "Submission portal closes tonight at 11:59 PM.",
                timestamp: "5 hours ago",
                unread: false
            },
            {
                id: 5,
                category: "announcement",
                icon: "📢",
                badgeBg: "var(--soft-yellow)",
                title: "Campus Library Timings Extended",
                message: "Library now open 24/7 during exam preparation week.",
                timestamp: "1 day ago",
                unread: false
            },
            {
                id: 6,
                category: "chat message",
                icon: "💬",
                badgeBg: "var(--mint-green)",
                title: "Academic Agent Response Ready",
                message: "Your generated 4-day study agenda is ready to review.",
                timestamp: "1 day ago",
                unread: false
            },
            {
                id: 7,
                category: "appointment reminder",
                icon: "🗓️",
                badgeBg: "var(--bubble-pink)",
                title: "Faculty Advising Slot Confirmed",
                message: "Meeting with Prof. Sharma scheduled for Friday 3:00 PM.",
                timestamp: "2 days ago",
                unread: false
            }
        ];

        function handleNotificationClick(category) {
            const cat = (category || '').toLowerCase();
            if (cat.includes('exam') || cat.includes('assignment')) {
                window.location.href = 'academic.html';
            } else if (cat.includes('placement')) {
                window.location.href = 'placement.html';
            } else if (cat.includes('event')) {
                window.location.href = 'events.html';
            } else if (cat.includes('announcement')) {
                window.location.href = 'student-services.html';
            } else if (cat.includes('chat')) {
                window.location.href = 'chat.html';
            } else if (cat.includes('appointment')) {
                window.location.href = 'communication.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        function renderNotifications() {
            const container = document.getElementById('notifications-list');
            // Capped to max 20
            const list = MOCK_NOTIFICATIONS.slice(0, 20);

            let html = '';
            list.forEach(item => {
                html += `
                    <div class="notification-card ${item.unread ? 'unread' : ''}" style="cursor: pointer;" onclick="handleNotificationClick('${item.category}')">
                        <div class="notification-icon-bg" style="background: ${item.badgeBg};">
                            ${item.icon}
                        </div>
                        <div style="flex: 1;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem;">
                                <h4 style="font-family: var(--font-heading); color: var(--primary-blue); font-size: 1.05rem;">${item.title}</h4>
                                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">${item.timestamp}</span>
                            </div>
                            <p style="font-size: 0.85rem; color: var(--text-main); margin-bottom: 0.4rem;">${item.message}</p>
                            <span class="sticker-tag" style="font-size: 0.65rem; padding: 0.15rem 0.5rem; margin: 0; background: var(--surface); border-color: var(--border-dark);">
                                ${item.category.toUpperCase()}
                            </span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function markAllAsRead() {
            MOCK_NOTIFICATIONS.forEach(n => n.unread = false);
            renderNotifications();
        }

        function viewHistoricalArchive() {
            MOCK_NOTIFICATIONS.forEach(n => n.unread = false);
            renderNotifications();
            const btn = document.getElementById('archive-btn');
            if (btn) {
                btn.textContent = '✓ All Historical Archive Records Loaded (20 Notifications Active)';
                btn.style.background = 'var(--mint-green)';
            }
        }

        renderNotifications();
    </script>
</body>
</html>
