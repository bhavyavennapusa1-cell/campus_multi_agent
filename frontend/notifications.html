<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus AI | Notifications</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .notifications-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 2rem 5%;
        }

        .notification-card {
            background: var(--surface);
            border: 2px solid var(--border-dark);
            border-radius: 16px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 3px 3px 0px var(--border-dark);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .notification-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--border-dark);
        }

        .notification-card.unread {
            border-left: 6px solid var(--primary-blue);
            background: #f8fbff;
        }

        .notification-icon-bg {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            box-shadow: 2px 2px 0px var(--border-dark);
        }
    </style>
</head>
<body>
    <!-- Navbar Reused -->
    <nav class="navbar">
        <div class="nav-brand">📚 CampusAgenda AI</div>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Assistant</a>
            <a href="about.html">Architecture</a>
        </div>
    </nav>

    <main class="notifications-container">
        <!-- Hero Header -->
        <div class="cloud-container" style="padding: 1.75rem; margin-bottom: 2rem;">
            <div class="sticker-tag" style="background: var(--bubble-pink);">🔔 Activity Feed</div>
            <h1 style="font-family: var(--font-heading); font-size: 2.3rem; color: var(--primary-blue);">Notifications</h1>
            <p style="color: var(--text-muted); max-width: 600px; margin: 0.25rem auto 0;">
                Real-time alerts generated across all academic, placement, event, and service agents.
            </p>
        </div>

        <!-- Filter & Actions Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
            <div style="font-family: var(--font-heading); font-size: 1.1rem; color: var(--text-main);">
                Recent Alerts (<span style="color: var(--primary-blue);">3 Unread</span>)
            </div>
            <button class="btn-pill" style="font-size: 0.8rem; padding: 0.3rem 0.8rem;" onclick="markAllAsRead()">Mark all as read ✓</button>
        </div>

        <!-- Scrollable Notifications List (Cap to max 20) -->
        <div id="notifications-list">
            <!-- Dynamic notifications rendered here -->
        </div>

        <!-- View All Link Stub -->
        <div style="text-align: center; margin-top: 2rem;">
            <button class="btn-pill" style="background: var(--surface); color: var(--text-main);" onclick="alert('Viewing all historical notifications stub triggered!')">
                View all notifications (Historical Archive) →
            </button>
        </div>
    </main>

    <footer class="footer">
        <p>Built with ❤️ for AgentX National Hackathon 2026 | <a href="https://github.com/bhavyavennapusa1-cell/campus_multi_agent" target="_blank" style="color: var(--primary-blue); font-weight: 600;">GitHub Repository</a></p>
    </footer>

    <script>
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('active');
        });

        // TODO: Replace with real GET /student/notifications
        const MOCK_NOTIFICATIONS = [
            {
                id: 1,
                category: "exam reminder",
                icon: "📝",
                badgeBg: "var(--mint-green)",
                title: "Distributed Systems Midterm Exam",
                message: "Exam scheduled in 4 days at Tech Tower Hall 3.",
                timestamp: "10 mins ago",
                unread: true
            },
            {
                id: 2,
                category: "placement deadline",
                icon: "💼",
                badgeBg: "var(--soft-yellow)",
                title: "Google Backend Internship Drive",
                message: "Eligibility verified! Application deadline is Aug 15.",
                timestamp: "45 mins ago",
                unread: true
            },
            {
                id: 3,
                category: "event reminder",
                icon: "⚡",
                badgeBg: "var(--bubble-pink)",
                title: "AgentX National Hackathon Keynote",
                message: "Starts tomorrow at 10:00 AM in Main Auditorium.",
                timestamp: "2 hours ago",
                unread: true
            },
            {
                id: 4,
                category: "assignment deadline",
                icon: "📚",
                badgeBg: "var(--lavender)",
                title: "Database SQL Optimization Assignment",
                message: "Submission portal closes tonight at 11:59 PM.",
                timestamp: "5 hours ago",
                unread: false
            },
            {
                id: 5,
                category: "announcement",
                icon: "📢",
                badgeBg: "var(--soft-yellow)",
                title: "Campus Library Timings Extended",
                message: "Library now open 24/7 during exam preparation week.",
                timestamp: "1 day ago",
                unread: false
            },
            {
                id: 6,
                category: "chat message",
                icon: "💬",
                badgeBg: "var(--mint-green)",
                title: "Academic Agent Response Ready",
                message: "Your generated 4-day study agenda is ready to review.",
                timestamp: "1 day ago",
                unread: false
            },
            {
                id: 7,
                category: "appointment reminder",
                icon: "🗓️",
                badgeBg: "var(--bubble-pink)",
                title: "Faculty Advising Slot Confirmed",
                message: "Meeting with Prof. Sharma scheduled for Friday 3:00 PM.",
                timestamp: "2 days ago",
                unread: false
            }
        ];

        function renderNotifications() {
            const container = document.getElementById('notifications-list');
            // Capped to max 20
            const list = MOCK_NOTIFICATIONS.slice(0, 20);

            let html = '';
            list.forEach(item => {
                html += `
                    <div class="notification-card ${item.unread ? 'unread' : ''}">
                        <div class="notification-icon-bg" style="background: ${item.badgeBg};">
                            ${item.icon}
                        </div>
                        <div style="flex: 1;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem;">
                                <h4 style="font-family: var(--font-heading); color: var(--primary-blue); font-size: 1.05rem;">${item.title}</h4>
                                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">${item.timestamp}</span>
                            </div>
                            <p style="font-size: 0.85rem; color: var(--text-main); margin-bottom: 0.4rem;">${item.message}</p>
                            <span class="sticker-tag" style="font-size: 0.65rem; padding: 0.15rem 0.5rem; margin: 0; background: var(--surface); border-color: var(--border-dark);">
                                ${item.category.toUpperCase()}
                            </span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function markAllAsRead() {
            MOCK_NOTIFICATIONS.forEach(n => n.unread = false);
            renderNotifications();
        }

        renderNotifications();
    </script>
</body>
</html>
