<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus AI | Student Onboarding</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .onboarding-wrapper {
            min-height: calc(100vh - 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 5%;
        }

        .onboarding-card {
            max-width: 520px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
        }

        .step-indicators {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .step-pill {
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            pointer-events: none;
            opacity: 0.6;
            transition: all 0.3s ease;
        }
        .step-pill.active {
            opacity: 1;
            transform: scale(1.05);
            background: var(--primary-blue) !important;
            color: white !important;
        }

        .step-content {
            display: none;
            text-align: left;
            animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .step-content.active { display: block; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .form-select-wrapper select {
            width: 100%;
            border: none;
            outline: none;
            font-family: var(--font-body);
            font-size: 1rem;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📚 CampusAgenda AI</div>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Assistant</a>
            <a href="about.html">Architecture</a>
        </div>
    </nav>


    <div class="onboarding-wrapper">
        <div class="cloud-container onboarding-card animate-pop">
            <div class="sticker-tag" style="background: var(--soft-yellow); margin-bottom: 1rem;">🚀 Initialize Agent</div>
            <h1 style="font-family: var(--font-heading); font-size: 2.5rem; color: var(--primary-blue); margin-bottom: 0.5rem;">Profile Setup</h1>
            <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">Personalize your multi-agent campus assistant.</p>

            <div class="step-indicators">
                <button type="button" class="btn-pill step-pill active" id="pill-step-1">1. Identity</button>
                <button type="button" class="btn-pill step-pill" id="pill-step-2" style="background: var(--surface); color: var(--text-main);">2. Academics</button>
                <button type="button" class="btn-pill step-pill" id="pill-step-3" style="background: var(--surface); color: var(--text-main);">3. Goals</button>
            </div>

            <form id="onboarding-form" onsubmit="handleOnboardingSubmit(event)">
                
                <div class="step-content active" id="step-1">
                    <label style="font-family: var(--font-heading); display: block; margin-bottom: 0.5rem; font-size: 1.1rem;">What's your full name?</label>
                    <div class="input-wrapper" style="margin-bottom: 2rem;">
                        <input type="text" id="ob-name" placeholder="e.g. Bhavya Vennapusa" required style="border: none; box-shadow: none;">
                    </div>
                    <div style="text-align: right;">
                        <button type="button" class="btn-blob" onclick="goToStep(2)">Continue →</button>
                    </div>
                </div>

                <div class="step-content" id="step-2">
                    <label style="font-family: var(--font-heading); display: block; margin-bottom: 0.5rem; font-size: 1.1rem;">Branch & Academic Year</label>
                    <div class="input-wrapper" style="margin-bottom: 2rem;">
                        <input type="text" id="ob-branch" placeholder="e.g. CSE - 3rd Year" required style="border: none; box-shadow: none;">
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <button type="button" class="btn-pill" style="background: var(--surface); color: var(--text-main);" onclick="goToStep(1)">← Back</button>
                        <button type="button" class="btn-blob" onclick="goToStep(3)">Continue →</button>
                    </div>
                </div>

                <div class="step-content" id="step-3">
                    <label style="font-family: var(--font-heading); display: block; margin-bottom: 0.5rem; font-size: 1.1rem;">Primary Career Goal</label>
                    <div class="input-wrapper form-select-wrapper" style="margin-bottom: 2rem; padding: 0.75rem 1rem;">
                        <select id="ob-career-goal" required>
                            <option value="Backend Developer" selected>Backend Developer</option>
                            <option value="Frontend Developer">Frontend Developer</option>
                            <option value="Data Scientist">Data Scientist</option>
                            <option value="Product Manager">Product Manager</option>
                        </select>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <button type="button" class="btn-pill" style="background: var(--surface); color: var(--text-main);" onclick="goToStep(2)">← Back</button>
                        <button type="submit" class="btn-blob" style="background: var(--mint-green);">Finish Setup ✨</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }

        function goToStep(stepNum) {

            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepNum}`).classList.add('active');

            for (let i = 1; i <= 3; i++) {
                const pill = document.getElementById(`pill-step-${i}`);
                if (i === stepNum) pill.classList.add('active');
                else pill.classList.remove('active');
            }
        }

        function handleOnboardingSubmit(e) {
            e.preventDefault();
            const btn = document.querySelector('button[type="submit"]');
            btn.innerHTML = "Saving... ⏳";
            
            setTimeout(() => {
                const studentData = {
                    name: document.getElementById('ob-name').value,
                    branch: document.getElementById('ob-branch').value,
                    careerGoal: document.getElementById('ob-career-goal').value,
                    attendance: "100%", // Defaulted for new user
                    hostel: "Unassigned"
                };
                localStorage.setItem('studentProfile', JSON.stringify(studentData));
                window.location.href = 'dashboard.html';
            }, 800);
        }
    </script>
</body>
</html>
