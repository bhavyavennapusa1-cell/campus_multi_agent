<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus AI | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrapper {
            min-height: calc(100vh - 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 5%;
            position: relative;
        }

        .login-card {
            max-width: 480px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
            z-index: 10;
        }

        .form-group-custom {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group-custom label {
            font-family: var(--font-heading);
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
            display: block;
        }

        .revealed-fields {
            display: none;
            animation: fadeInFields 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
        }
        .revealed-fields.active { display: block; }

        @keyframes fadeInFields {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inline-error-box {
            display: none;
            background: #fadbd8;
            border: 2px solid #e74c3c;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            color: #c0392b;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: left;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .btn-blob:disabled {
            background: #e0e0e0;
            color: #9e9e9e;
            border-color: #9e9e9e;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 2px 2px 0px #9e9e9e !important;
        }
        
        .input-wrapper select {
            width: 100%;
            border: none;
            outline: none;
            font-family: var(--font-body);
            font-size: 1rem;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📚 CampusAgenda AI</div>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Assistant</a>
        </div>

    </nav>


    <div class="login-wrapper">
        <div class="cloud-container login-card animate-pop">
            <div class="sticker-tag" style="background: var(--mint-green); margin-bottom: 1rem;">🔐 Secure Portal</div>
            <h1 style="font-family: var(--font-heading); font-size: 2.5rem; color: var(--primary-blue); margin-bottom: 0.5rem;">Welcome Back</h1>
            <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">Log in to orchestrate your campus life.</p>

            <div id="inline-error-msg" class="inline-error-box"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group-custom">
                    <label for="school-select">Institution</label>
                    <div class="input-wrapper" style="padding: 0.75rem 1rem;">
                        <span style="font-size: 1.2rem; align-self: center; padding-right: 0.5rem;">🏫</span>
                        <select id="school-select" onchange="handleSchoolChange()">
                            <option value="" disabled selected>-- Select your campus --</option>
                        </select>
                    </div>
                </div>

                <div id="conditional-fields" class="revealed-fields">
                    <div class="form-group-custom">
                        <label for="login-rollno">Roll Number</label>
                        <div class="input-wrapper">
                            <input type="text" id="login-rollno" placeholder="e.g. 1602-23-733-045" oninput="validateForm()" required style="border: none; box-shadow: none;">
                        </div>
                    </div>

                    <div class="form-group-custom">
                        <label for="login-password">Password</label>
                        <div class="input-wrapper" style="position: relative;">
                            <input type="password" id="login-password" placeholder="••••••••" oninput="validateForm()" required style="border: none; box-shadow: none; width: 100%;">
                            <button type="button" onclick="togglePasswordVisibility()" id="toggle-password-btn" style="background: var(--soft-yellow); border: 2px solid var(--border-dark); border-radius: 12px; padding: 0.3rem 0.8rem; font-family: var(--font-heading); font-size: 0.8rem; cursor: pointer; box-shadow: 2px 2px 0px var(--border-dark);">Show</button>
                        </div>
                    </div>

                    <button type="submit" id="login-submit-btn" class="btn-blob" disabled style="width: 100%; margin-top: 1rem;">
                        Log In to Workspace →
                    </button>
                </div>
            </form>

            <div style="margin-top: 2rem; font-size: 0.95rem; color: var(--text-muted);">
                New here? <a href="onboarding.html" style="color: var(--primary-blue); font-weight: 700; text-decoration: underline;">Setup Profile →</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }

        const MOCK_SCHOOLS = [

            "Vasavi College of Engineering",
            "IIT Hyderabad",
            "BITS Pilani - Hyderabad Campus",
            "NIT Warangal",
            "IIIT Hyderabad"
        ];

        function populateSchoolDropdown() {
            const select = document.getElementById('school-select');
            MOCK_SCHOOLS.forEach(school => {
                const opt = document.createElement('option');
                opt.value = school;
                opt.textContent = school;
                select.appendChild(opt);
            });
        }

        function handleSchoolChange() {
            const val = document.getElementById('school-select').value;
            const fields = document.getElementById('conditional-fields');
            document.getElementById('inline-error-msg').style.display = 'none';
            
            if (val) fields.classList.add('active');
            else fields.classList.remove('active');
            validateForm();
        }

        function togglePasswordVisibility() {
            const pwd = document.getElementById('login-password');
            const btn = document.getElementById('toggle-password-btn');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                btn.textContent = 'Hide';
            } else {
                pwd.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function validateForm() {
            const s = document.getElementById('school-select').value;
            const r = document.getElementById('login-rollno').value.trim();
            const p = document.getElementById('login-password').value;
            document.getElementById('login-submit-btn').disabled = !(s && r && p);
        }

        function handleLogin(e) {
            e.preventDefault();
            const err = document.getElementById('inline-error-msg');
            err.style.display = 'none';
            
            const btn = document.getElementById('login-submit-btn');
            btn.innerHTML = "Authenticating... ⏳";
            
            setTimeout(() => {
                localStorage.setItem('studentSession', JSON.stringify({ 
                    school: document.getElementById('school-select').value, 
                    rollNo: document.getElementById('login-rollno').value.trim() 
                }));
                window.location.href = 'dashboard.html';
            }, 800);
        }

        populateSchoolDropdown();
    </script>
</body>
</html>
