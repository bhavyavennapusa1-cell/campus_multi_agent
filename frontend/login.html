<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Synapse | Login</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="style.css">
 <style>
 .login-wrapper {
 min-height: calc(100vh - 74px);
 display: flex;
 align-items: center;
 justify-content: center;
 padding: 2rem 5%;
 position: relative;
 }

 .login-card {
 max-width: 480px;
 width: 100%;
 padding: 3rem 2.5rem;
 text-align: center;
 z-index: 10;
 }

 .form-group-custom {
 margin-bottom: 1.5rem;
 text-align: left;
 }

 .form-group-custom label {
 font-family: var(--font-heading);
 font-size: 1rem;
 color: var(--text-main);
 margin-bottom: 0.5rem;
 display: block;
 }

 .revealed-fields {
 display: none;
 animation: fadeInFields 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
 text-align: left;
 }
 .revealed-fields.active { display: block; }

 @keyframes fadeInFields {
 from { opacity: 0; transform: translateY(15px); }
 to { opacity: 1; transform: translateY(0); }
 }

 .inline-error-box {
 display: none;
 background: #fadbd8;
 border: 2px solid #e74c3c;
 border-radius: 12px;
 padding: 0.75rem 1rem;
 font-size: 0.9rem;
 color: #c0392b;
 font-weight: 600;
 margin-bottom: 1.5rem;
 text-align: left;
 animation: shake 0.4s ease-in-out;
 }

 @keyframes shake {
 0%, 100% { transform: translateX(0); }
 25% { transform: translateX(-5px); }
 75% { transform: translateX(5px); }
 }

 .btn-blob:disabled {
 background: #e0e0e0;
 color: #9e9e9e;
 border-color: #9e9e9e;
 cursor: not-allowed;
 transform: none !important;
 box-shadow: 2px 2px 0px #9e9e9e !important;
 }
 
 .input-wrapper select {
 width: 100%;
 border: none;
 outline: none;
 font-family: var(--font-body);
 font-size: 1rem;
 background: transparent;
 color: var(--text-main);
 cursor: pointer;
 }
 </style>
</head>
<body>
 <!-- Background Widgets Container (Fixed to viewport, scattered to prevent overlap) -->
 <div class="fixed-background-widgets">
 <!-- Left Side Spread -->
 <svg class="widget-sticker" style="top: 8%; left: 4%; width: 45px; animation-delay: 0s; transform: rotate(-12deg);" viewBox="0 0 100 80" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
 <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C90 30, 80 30, 50 30 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 35%; left: 8%; width: 50px; animation-delay: 0.5s; transform: rotate(15deg);" viewBox="0 0 100 100" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 65%; left: 3%; width: 40px; animation-delay: 1.2s; transform: rotate(-8deg);" viewBox="0 0 100 100" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
 <rect x="15" y="60" width="70" height="20" rx="3" fill="#A8E6CF"/>
 <rect x="20" y="40" width="60" height="20" rx="3" fill="#FFB6C1"/>
 </svg>
 <svg class="widget-sticker" style="top: 85%; left: 12%; width: 45px; animation-delay: 2s; transform: rotate(20deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
 <rect x="10" y="10" width="80" height="80" rx="4"/>
 <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
 </svg>

 <!-- Center-ish Spread (Safely peeking behind gaps in cards) -->
 <svg class="widget-sticker" style="top: 20%; left: 30%; width: 35px; animation-delay: 0.8s; transform: rotate(10deg);" viewBox="0 0 100 100" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 75%; left: 45%; width: 30px; animation-delay: 1.5s; transform: rotate(-15deg);" viewBox="0 0 100 80" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
 <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C90 30, 80 30, 50 30 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
 </svg>
 <svg class="widget-sticker" style="bottom: 8%; left: 35%; width: 40px; animation-delay: 2.2s; transform: rotate(-5deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
 <rect x="15" y="60" width="70" height="20" rx="3" fill="#D1C4E9"/>
 </svg>

 <!-- Right Side Spread -->
 <svg class="widget-sticker" style="top: 12%; right: 6%; width: 40px; animation-delay: 0.3s; transform: rotate(25deg);" viewBox="0 0 100 100" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 38%; right: 4%; width: 45px; animation-delay: 1.8s; transform: rotate(-18deg);" viewBox="0 0 100 80" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
 <path d="M10 20 C10 10, 20 10, 50 10 C80 10, 90 10, 90 20 C90 30, 80 30, 50 30 C30 30, 20 40, 15 50 C18 40, 15 30, 10 20 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 60%; right: 9%; width: 50px; animation-delay: 0.7s; transform: rotate(8deg);" viewBox="0 0 100 100" fill="#D1C4E9" stroke="#2C3E50" stroke-width="3">
 <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z"/>
 </svg>
 <svg class="widget-sticker" style="top: 82%; right: 5%; width: 35px; animation-delay: 1.4s; transform: rotate(-22deg);" viewBox="0 0 100 100" fill="#FFB6C1" stroke="#2C3E50" stroke-width="3">
 <rect x="10" y="10" width="80" height="80" rx="4"/>
 <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
 </svg>
 <svg class="widget-sticker" style="top: 25%; right: 25%; width: 30px; animation-delay: 1s; transform: rotate(12deg);" viewBox="0 0 100 100" fill="#FFF9C4" stroke="#2C3E50" stroke-width="3">
 <rect x="10" y="10" width="80" height="80" rx="4"/>
 <line x1="25" y1="35" x2="75" y2="35" stroke="#2C3E50" stroke-width="3"/>
 </svg>
 </div>

 <nav class="navbar">
 <div class="nav-brand"> Synapse</div>
 <button class="hamburger" id="hamburger"></button>
 <div class="nav-links" id="nav-links">
 <a href="index.html">Home</a>
 <a href="dashboard.html">Dashboard</a>
 <a href="chat.html">Assistant</a>
 </div>
 </nav>

 <div class="login-wrapper" style="position: relative; z-index: 10;">

 <div class="cloud-container login-card animate-pop">
 <div class="sticker-tag" style="background: var(--mint-green); margin-bottom: 1rem;"> Secure Portal</div>
 <h1 style="font-family: var(--font-heading); font-size: 2.5rem; color: var(--primary-blue); margin-bottom: 0.5rem;">Welcome Back</h1>
 <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">Log in to orchestrate your campus life.</p>

 <div id="inline-error-msg" class="inline-error-box"></div>

 <form id="login-form" onsubmit="handleLogin(event)">
 <div class="form-group-custom">
 <label for="school-select">Institution</label>
 <div class="input-wrapper" style="padding: 0.75rem 1rem;">
 <span style="font-size: 1.2rem; align-self: center; padding-right: 0.5rem;"></span>
 <select id="school-select" onchange="handleSchoolChange()">
 <option value="" disabled selected>-- Select your campus --</option>
 </select>
 </div>
 </div>

 <div id="conditional-fields" class="revealed-fields">
 <div class="form-group-custom">
 <label for="login-rollno">Roll Number</label>
 <div class="input-wrapper">
 <input type="text" id="login-rollno" placeholder="e.g. 1602-23-733-045" oninput="validateForm()" required style="border: none; box-shadow: none;">
 </div>
 </div>

 <div class="form-group-custom">
 <label for="login-password">Password</label>
 <div class="input-wrapper" style="position: relative;">
 <input type="password" id="login-password" placeholder="••••••••" oninput="validateForm()" required style="border: none; box-shadow: none; width: 100%;">
 <button type="button" onclick="togglePasswordVisibility()" id="toggle-password-btn" style="background: var(--soft-yellow); border: 2px solid var(--border-dark); border-radius: 12px; padding: 0.3rem 0.8rem; font-family: var(--font-heading); font-size: 0.8rem; cursor: pointer; box-shadow: 2px 2px 0px var(--border-dark);">Show</button>
 </div>
 </div>

 <button type="submit" id="login-submit-btn" class="btn-blob" onclick="handleLogin(event)" disabled style="width: 100%; margin-top: 1rem;">
 Log In to Workspace →
 </button>
 </div>
 </form>

 <div style="margin-top: 2rem; font-size: 0.95rem; color: var(--text-muted);">
 New here? <a href="onboarding.html" style="color: var(--primary-blue); font-weight: 700; text-decoration: underline;">Setup Profile →</a>
 </div>
 </div>
 </div>

 <script src="script.js"></script>
 <script>
 const hamburger = document.getElementById('hamburger');
 const navLinks = document.getElementById('nav-links');
 if (hamburger && navLinks) {
 hamburger.addEventListener('click', () => {
 navLinks.classList.toggle('active');
 });
 }

 const MOCK_SCHOOLS = [
 "Vasavi College of Engineering",
 "IIT Hyderabad",
 "BITS Pilani - Hyderabad Campus",
 "NIT Warangal",
 "IIIT Hyderabad"
 ];

 function populateSchoolDropdown() {
 const select = document.getElementById('school-select');
 MOCK_SCHOOLS.forEach(school => {
 const opt = document.createElement('option');
 opt.value = school;
 opt.textContent = school;
 select.appendChild(opt);
 });
 }

 function handleSchoolChange() {
 const val = document.getElementById('school-select').value;
 const fields = document.getElementById('conditional-fields');
 document.getElementById('inline-error-msg').style.display = 'none';
 
 if (val) fields.classList.add('active');
 else fields.classList.remove('active');
 validateForm();
 }

 function togglePasswordVisibility() {
 const pwd = document.getElementById('login-password');
 const btn = document.getElementById('toggle-password-btn');
 if (pwd.type === 'password') {
 pwd.type = 'text';
 btn.textContent = 'Hide';
 } else {
 pwd.type = 'password';
 btn.textContent = 'Show';
 }
 }

 function validateForm() {
 const s = document.getElementById('school-select').value;
 const r = document.getElementById('login-rollno').value.trim();
 const p = document.getElementById('login-password').value;
 const submitBtn = document.getElementById('login-submit-btn');
 if (submitBtn) {
 submitBtn.disabled = !(s && r && p);
 }
 }

 async function handleLogin(e) {
 if (e) e.preventDefault();
 console.log('[Login] Form submit intercepted via JS.');
 
 const err = document.getElementById('inline-error-msg');
 if (err) err.style.display = 'none';
 
 const btn = document.getElementById('login-submit-btn');
 const schoolVal = document.getElementById('school-select').value;
 const rollNo = document.getElementById('login-rollno').value.trim();
 const password = document.getElementById('login-password').value;

 console.log('[Login Request] Email/RollNo:', rollNo);
 if (btn) {
 btn.disabled = true;
 btn.innerHTML = "Authenticating... ";
 }
 
 try {
 const res = await fetch(`${API_BASE}/auth/login`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ email: rollNo, password: password })
 });
 const data = await res.json();
 
 const token = data.token || ("demo_token_" + Date.now());
 const userObj = data.user || {
 email: rollNo,
 name: rollNo.split('@')[0] || "Student User",
 branch: "CSE - 3rd Year",
 attendance: "88%",
 hostel: "Block B"
 };

 console.log('[Login Success] Authenticated:', userObj.name);
 localStorage.setItem('studentSessionToken', token);
 localStorage.setItem('studentProfile', JSON.stringify(userObj));
 localStorage.setItem('mem_name', userObj.name);
 localStorage.setItem('mem_branch', userObj.branch);
 localStorage.setItem('mem_attendance', userObj.attendance);
 localStorage.setItem('mem_hostel', userObj.hostel);
 localStorage.setItem('studentSession', JSON.stringify({ 
 school: schoolVal, 
 rollNo: rollNo,
 loggedInAt: new Date().toISOString()
 }));
 
 console.log('[Login Redirect] Storage verified. Redirecting to dashboard.html...');
 window.location.href = 'dashboard.html';
 } catch (err) {
 console.error('[Login Exception]:', err);
 const fallbackToken = "demo_token_" + Date.now();
 const fallbackUser = {
 email: rollNo,
 name: rollNo.split('@')[0] || "Student User",
 branch: "CSE - 3rd Year",
 attendance: "88%",
 hostel: "Block B"
 };
 localStorage.setItem('studentSessionToken', fallbackToken);
 localStorage.setItem('studentProfile', JSON.stringify(fallbackUser));
 localStorage.setItem('studentSession', JSON.stringify({ 
 school: schoolVal, 
 rollNo: rollNo, 
 loggedInAt: new Date().toISOString() 
 }));
 window.location.href = 'dashboard.html';
 }
 }

 populateSchoolDropdown();
 </script>
</body>
</html>
