<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Campus AI | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="chat.css">
    <style>
        .login-wrapper {
            min-height: calc(100vh - 74px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 5%;
        }

        .login-card {
            max-width: 460px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .form-group-custom {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group-custom label {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 0.35rem;
            display: block;
        }

        /* Smooth fade-in for revealed form fields */
        .revealed-fields {
            display: none;
            animation: fadeInFields 0.25s ease-out;
            text-align: left;
        }

        .revealed-fields.active {
            display: block;
        }

        @keyframes fadeInFields {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Inline Error Message Box */
        .inline-error-box {
            display: none;
            background: #fadbd8;
            border: 2px solid #e74c3c;
            border-radius: 12px;
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            color: #c0392b;
            font-weight: 600;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        /* Disabled state styling for btn-blob */
        .btn-blob:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 2px 2px 0px var(--border-dark) !important;
        }
    </style>
</head>
<body>
    <!-- Navbar Reused -->
    <nav class="navbar">
        <div class="nav-brand">📚 CampusAgenda AI</div>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html">Assistant</a>
            <a href="about.html">Architecture</a>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="cloud-container login-card">
            <div class="sticker-tag" style="background: var(--mint-green); margin-bottom: 1rem;">🔐 Student Portal</div>
            <h1 style="font-family: var(--font-heading); font-size: 2.2rem; color: var(--primary-blue); margin-bottom: 0.5rem;">Welcome Back</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.75rem;">Log in to access your multi-agent campus workspace</p>

            <!-- Inline Error Message Display (No browser alert) -->
            <div id="inline-error-msg" class="inline-error-box"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <!-- STEP 1: Select School Dropdown FIRST -->
                <div class="form-group-custom">
                    <label for="school-select">Select School / College</label>
                    <div class="input-wrapper">
                        <span style="font-size: 1.1rem; align-self: center;">🏫</span>
                        <select id="school-select" onchange="handleSchoolChange()" style="flex: 1; border: none; outline: none; font-family: var(--font-body); font-size: 0.95rem; background: transparent; color: var(--text-main); cursor: pointer;">
                            <option value="" disabled selected>-- Select your institution --</option>
                        </select>
                    </div>
                </div>

                <!-- STEP 2: Revealed ONLY after a school is selected -->
                <div id="conditional-fields" class="revealed-fields">
                    <!-- STEP 3: Roll Number (Styled like memory-group input from chat.html) -->
                    <div class="memory-group" style="margin-bottom: 1.25rem;">
                        <label for="login-rollno">Roll Number</label>
                        <input type="text" id="login-rollno" placeholder="e.g. 1602-23-733-045" oninput="validateForm()" required>
                    </div>

                    <!-- STEP 4: Password with Show/Hide Toggle -->
                    <div class="memory-group" style="margin-bottom: 1.75rem;">
                        <label for="login-password">Password</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="login-password" placeholder="••••••••" oninput="validateForm()" required style="padding-right: 3.5rem;">
                            <button type="button" id="toggle-password-btn" onclick="togglePasswordVisibility()" style="position: absolute; right: 8px; background: var(--surface); border: 1.5px solid var(--border-dark); border-radius: 8px; padding: 0.2rem 0.55rem; font-family: var(--font-heading); font-size: 0.75rem; cursor: pointer; color: var(--text-main); box-shadow: 1px 1px 0px var(--border-dark);">
                                Show
                            </button>
                        </div>
                    </div>

                    <!-- STEP 5: Single .btn-blob Log In button disabled until all 3 fields have values -->
                    <button type="submit" id="login-submit-btn" class="btn-blob" disabled style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 0.85rem 0;">
                        Log In →
                    </button>
                </div>
            </form>

            <!-- STEP 6: Existing Onboarding Link -->
            <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                New here? <a href="onboarding.html" style="color: var(--primary-blue); font-weight: 700; text-decoration: underline;">Onboard →</a>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Built with ❤️ for AgentX National Hackathon 2026 | <a href="https://github.com/bhavyavennapusa1-cell/campus_multi_agent" target="_blank" style="color: var(--primary-blue); font-weight: 600;">GitHub Repository</a></p>
    </footer>

    <script>
        document.getElementById('hamburger').addEventListener('click', () => {
            document.getElementById('nav-links').classList.toggle('active');
        });

        // Mock Schools Data Array (Structured for easy swapping with GET /auth/schools)
        // TODO: Replace mock array with real GET /auth/schools endpoint
        const MOCK_SCHOOLS = [
            "Vasavi College of Engineering",
            "IIT Hyderabad",
            "BITS Pilani - Hyderabad Campus",
            "NIT Warangal",
            "IIIT Hyderabad",
            "Osmania University College of Engineering",
            "Other Institution"
        ];

        // Populate School Select Dropdown
        function populateSchoolDropdown() {
            const select = document.getElementById('school-select');
            MOCK_SCHOOLS.forEach(schoolName => {
                const opt = document.createElement('option');
                opt.value = schoolName;
                opt.textContent = schoolName;
                select.appendChild(opt);
            });
        }

        // STEP 2: Reveal Roll Number and Password ONLY after school is chosen
        function handleSchoolChange() {
            const schoolVal = document.getElementById('school-select').value;
            const conditionalFields = document.getElementById('conditional-fields');
            hideInlineError();

            if (schoolVal && schoolVal !== '') {
                conditionalFields.classList.add('active');
            } else {
                conditionalFields.classList.remove('active');
            }
            validateForm();
        }

        // STEP 4: Password Show/Hide Toggle
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('login-password');
            const toggleBtn = document.getElementById('toggle-password-btn');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        // STEP 5: Enable Log In button only when all 3 fields (school, roll no, password) have values
        function validateForm() {
            const schoolVal = document.getElementById('school-select').value;
            const rollVal = document.getElementById('login-rollno').value.trim();
            const pwdVal = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('login-submit-btn');

            if (schoolVal && rollVal && pwdVal) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        // Helper for showing small inline error messages
        function showInlineError(msg) {
            const errBox = document.getElementById('inline-error-msg');
            errBox.textContent = msg;
            errBox.style.display = 'block';
        }

        function hideInlineError() {
            const errBox = document.getElementById('inline-error-msg');
            errBox.style.display = 'none';
        }

        // STEP 7 & 8: Form Submission & Client-Side Validation
        function handleLogin(e) {
            e.preventDefault();
            hideInlineError();

            const school = document.getElementById('school-select').value;
            const rollNo = document.getElementById('login-rollno').value.trim();
            const password = document.getElementById('login-password').value;

            // Client-side validation
            if (!school || school === '') {
                showInlineError("⚠️ Please select your school or college first.");
                return;
            }

            if (!rollNo || !password) {
                showInlineError("⚠️ Roll Number and Password are required to log in.");
                return;
            }

            // TODO: replace with real POST /auth/login call
            /*
             * Real implementation:
             * const response = await fetch('/auth/login', {
             *     method: 'POST',
             *     headers: { 'Content-Type': 'application/json' },
             *     body: JSON.stringify({ school, rollNo, password })
             * });
             * if (!response.ok) throw new Error('Login failed');
             * const data = await response.json();
             */

            // Store mock session data
            localStorage.setItem('studentSession', JSON.stringify({ 
                school: school, 
                rollNo: rollNo, 
                loggedInAt: new Date().toISOString() 
            }));

            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        }

        // Initialize dropdown
        populateSchoolDropdown();
    </script>
</body>
</html>
